<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Illumico Jobs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>Illumico Jobs</title>
<style>
:root{
  --bg:#111418;--card:#1b2027;--card2:#232a33;--line:#2e3742;--text:#eef2f6;--muted:#93a0ae;
  --accent:#f2b544;--land:#4caf7a;--holi:#e0564f;--blue:#4a90d9;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}h1 span{color:var(--accent)}
.who{font-size:13px;color:var(--muted)}
.who button{background:none;border:0;color:var(--blue);font-size:13px;padding:0 0 0 8px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button,.chip{flex:1;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px;border-radius:10px;font-size:14px}
.tabs button.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
.filter{margin-top:8px;width:100%}
main{padding:12px 16px}
.day{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.day.today{color:var(--accent)}
.job{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;border-left:5px solid var(--land);cursor:pointer}
.job.Holiday{border-left-color:var(--holi)}
.job .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.job b{font-size:17px}
.job .sub{color:var(--muted);font-size:14px;margin-top:2px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.Landscape{background:#1f3a2b;color:#8be0b0}.badge.Holiday{background:#41201f;color:#ffa29c}
.st{font-size:12px;font-weight:600}
.st-Scheduled{color:var(--muted)}.st-En-route{color:var(--blue)}.st-In-progress{color:var(--accent)}.st-Done{color:var(--land)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:36px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cell{aspect-ratio:1;background:var(--card);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:14px;border:2px solid transparent}
.cell.out{opacity:.3}.cell.today{color:var(--accent);font-weight:700}.cell.sel{border-color:var(--accent)}
.dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--land)}.dot.Holiday{background:var(--holi)}
/* buttons */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#111;font-size:32px;border:0;box-shadow:0 6px 20px #0008}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;font-weight:600;background:var(--card2);color:var(--text);margin-top:8px;text-align:center;text-decoration:none}
.btn.pri{background:var(--accent);color:#111}.btn.blue{background:var(--blue);color:#fff}.btn.danger{background:none;color:var(--holi)}
.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btns3 .btn{margin-top:0;font-size:14px;padding:12px 4px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:#0009;z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:11;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s}
.open .sheet-bg{display:block}.open .sheet{transform:none}
.grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-size:22px}
.field{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
.field .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.notes{white-space:pre-wrap}
.statusrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.statusrow button{padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px}
.statusrow button.on{background:var(--text);color:#111;font-weight:700}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--card2)}
label.inp{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
textarea{min-height:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.typepick button{padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--muted);font-size:15px}
.typepick button.on.Landscape{border-color:var(--land);color:#8be0b0}.typepick button.on.Holiday{border-color:var(--holi);color:#ffa29c}
.crewpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.crewpick button{padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:14px}
.crewpick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* login */
#login{max-width:340px;margin:18vh auto 0;padding:0 20px;text-align:center}
#login input{text-align:center;font-size:28px;letter-spacing:.4em}
.err{color:var(--holi);margin-top:10px;min-height:20px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:#111;padding:10px 18px;border-radius:20px;font-size:14px;z-index:20;display:none}
.loading{opacity:.5;pointer-events:none}
</style>
</head>
<body>

<div id="login" style="display:none">
  <h1>Illumico <span>Jobs</span></h1>
  <p class="who">Enter your PIN</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn pri" id="loginBtn">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="top">
      <h1>Illumico <span>Jobs</span></h1>
      <div class="who"><span id="whoName"></span><button id="refreshBtn">↻</button><button id="logoutBtn">Sign out</button></div>
    </div>
    <div class="tabs">
      <button data-tab="up" class="on">Upcoming</button>
      <button data-tab="cal">Calendar</button>
      <button data-tab="done">Done</button>
    </div>
    <select class="filter" id="crewFilter" style="display:none"></select>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" style="display:none">+</button>
</div>

<div id="sheetWrap"><div class="sheet-bg" id="sheetBg"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="photoInput" accept="image/*" multiple style="display:none">

<script>
/* ====== CONFIG: paste your Apps Script Web app URL here ====== */
const API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const COMPANY = 'Illumico Michigan';
/* ============================================================== */

const STATUSES = ['Scheduled', 'En route', 'In progress', 'Done'];
const S = { pin: '', user: null, jobs: [], crew: [], tab: 'up', filter: '', month: new Date(), sel: ymd(new Date()), openId: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const list = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const isOwner = () => S.user && S.user.role === 'owner';

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function niceDay(s) {
  if (!s) return 'No date set';
  const t = ymd(new Date()), tm = ymd(new Date(Date.now() + 864e5));
  if (s === t) return 'Today';
  if (s === tm) return 'Tomorrow';
  return parseDay(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function niceTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm');
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2200); }

async function api(action, extra = {}) {
  document.body.classList.add('loading');
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, pin: S.pin }, extra)) });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    S.user = d.user; S.jobs = d.jobs; S.crew = d.crew;
    return d;
  } finally { document.body.classList.remove('loading'); }
}

/* ---------- login ---------- */
async function login(pin) {
  S.pin = pin;
  try {
    await api('login');
    try { localStorage.setItem('illumicoPin', pin); } catch (e) {}
    $('login').style.display = 'none'; $('app').style.display = 'block';
    $('whoName').textContent = S.user.name;
    $('fab').style.display = isOwner() ? 'block' : 'none';
    setupFilter();
    render();
  } catch (e) {
    $('login').style.display = 'block'; $('app').style.display = 'none';
    $('loginErr').textContent = e.message === 'Wrong PIN' ? 'Wrong PIN' : 'Could not connect: ' + e.message;
    try { localStorage.removeItem('illumicoPin'); } catch (x) {}
  }
}
$('loginBtn').onclick = () => login($('pin').value.trim());
$('pin').onkeydown = e => { if (e.key === 'Enter') login($('pin').value.trim()); };
$('logoutBtn').onclick = () => { try { localStorage.removeItem('illumicoPin'); } catch (e) {} location.reload(); };
$('refreshBtn').onclick = async () => { await api('list'); render(); toast('Updated'); };

function setupFilter() {
  const f = $('crewFilter');
  if (!isOwner() || S.crew.length < 2) { f.style.display = 'none'; return; }
  f.style.display = 'block';
  f.innerHTML = '<option value="">All installers</option><option value="__none">Unassigned</option>' +
    S.crew.map(c => `<option>${esc(c.name)}</option>`).join('');
  f.onchange = () => { S.filter = f.value; render(); };
}

/* ---------- tabs & rendering ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); S.tab = b.dataset.tab; render();
});

function visibleJobs() {
  return S.jobs.filter(j => {
    if (!S.filter) return true;
    if (S.filter === '__none') return !list(j.installers).length;
    return list(j.installers).includes(S.filter);
  }).sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.start || '').localeCompare(b.start || ''));
}

function jobCard(j) {
  const crew = list(j.installers);
  return `<div class="job ${esc(j.type)}" data-id="${esc(j.id)}">
    <div class="row"><b>${esc(j.client)}</b><span class="st st-${esc((j.status || '').replace(' ', '-'))}">${esc(j.status)}</span></div>
    <div class="sub">${j.start ? esc(niceTime(j.start)) + ' · ' : ''}${esc(j.address)}</div>
    <div class="row" style="margin-top:6px"><span class="badge ${esc(j.type)}">${j.type === 'Holiday' ? 'Permanent Holiday' : 'Landscape'}</span>
    <span class="sub">${crew.length ? esc(crew.join(', ')) : (isOwner() ? '<span style="color:var(--holi)">Unassigned</span>' : '')}</span></div>
  </div>`;
}

function groupByDay(jobs) {
  const t = ymd(new Date());
  let html = '', last = null;
  jobs.forEach(j => {
    if (j.date !== last) { html += `<div class="day ${j.date === t ? 'today' : ''}">${esc(niceDay(j.date))}</div>`; last = j.date; }
    html += jobCard(j);
  });
  return html;
}

function render() {
  const m = $('main'), jobs = visibleJobs(), t = ymd(new Date());
  if (S.tab === 'up') {
    const up = jobs.filter(j => j.status !== 'Done' && (!j.date || j.date >= t || j.status !== 'Scheduled'));
    m.innerHTML = up.length ? groupByDay(up) : `<div class="empty">No upcoming jobs${isOwner() ? '<br>Tap + to add one' : ''}</div>`;
  } else if (S.tab === 'done') {
    const done = jobs.filter(j => j.status === 'Done').reverse();
    m.innerHTML = done.length ? groupByDay(done) : '<div class="empty">No completed jobs yet</div>';
  } else {
    m.innerHTML = calendar(jobs);
    m.querySelectorAll('.cal-head button').forEach(b => b.onclick = () => {
      S.month = new Date(S.month.getFullYear(), S.month.getMonth() + Number(b.dataset.d), 1); render();
    });
    m.querySelectorAll('.cell[data-d]').forEach(c => c.onclick = () => { S.sel = c.dataset.d; render(); });
  }
  m.querySelectorAll('.job').forEach(c => c.onclick = () => openJob(c.dataset.id));
}

function calendar(jobs) {
  const y = S.month.getFullYear(), mo = S.month.getMonth();
  const first = new Date(y, mo, 1), start = new Date(y, mo, 1 - first.getDay());
  const t = ymd(new Date());
  const byDay = {};
  jobs.forEach(j => { if (j.date) (byDay[j.date] = byDay[j.date] || []).push(j); });
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = ymd(d);
    if (i >= 35 && d.getMonth() !== mo) break;
    const js = byDay[k] || [];
    cells += `<div class="cell ${d.getMonth() !== mo ? 'out' : ''} ${k === t ? 'today' : ''} ${k === S.sel ? 'sel' : ''}" data-d="${k}">
      ${d.getDate()}<div class="dots">${js.slice(0, 4).map(j => `<i class="dot ${esc(j.type)}"></i>`).join('')}</div></div>`;
  }
  const dayJobs = byDay[S.sel] || [];
  return `<div class="cal-head"><button data-d="-1">‹</button><b>${first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</b><button data-d="1">›</button></div>
    <div class="grid">${'SMTWTFS'.split('').map(x => `<div class="dow">${x}</div>`).join('')}${cells}</div>
    <div class="day">${esc(niceDay(S.sel))}</div>
    ${dayJobs.length ? dayJobs.map(jobCard).join('') : `<div class="empty" style="padding:16px">Nothing scheduled${isOwner() ? ` · <a href="#" id="addHere" style="color:var(--accent)">Add job this day</a>` : ''}</div>`}`;
}
document.addEventListener('click', e => { if (e.target.id === 'addHere') { e.preventDefault(); editJob(null, S.sel); } });

/* ---------- sheet ---------- */
function openSheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; $('sheetWrap').classList.add('open'); $('sheet').scrollTop = 0; }
function closeSheet() { $('sheetWrap').classList.remove('open'); S.openId = null; }
$('sheetBg').onclick = closeSheet;

function smsLink(phone, body) {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  return `sms:${phone.replace(/[^\d+]/g, '')}${ios ? '&' : '?'}body=${encodeURIComponent(body)}`;
}

function openJob(id) {
  const j = S.jobs.find(x => x.id === id); if (!j) return;
  S.openId = id;
  const first = (j.client || '').split(/\s|&/)[0];
  const kind = j.type === 'Holiday' ? 'permanent holiday lighting' : 'landscape lighting';
  const omw = `Hi ${first}, this is ${S.user.name} with ${COMPANY}. I'm on my way to your home for your ${kind} install now. See you soon!`;
  const photos = list(j.photos);
  openSheet(`
    <h2>${esc(j.client)}</h2>
    <span class="badge ${esc(j.type)}">${j.type === 'Holiday' ? 'Permanent Holiday' : 'Landscape'}</span>
    <div class="field"><div class="lbl">When</div>${esc(niceDay(j.date))}${j.start ? ' · ' + esc(niceTime(j.start)) + (j.end ? '–' + esc(niceTime(j.end)) : '') : ''}</div>
    <div class="field"><div class="lbl">Address</div>${esc(j.address) || '—'}</div>
    <div class="btns3" style="margin-top:10px">
      <a class="btn" href="https://maps.google.com/?q=${encodeURIComponent(j.address)}" target="_blank">🧭 Navigate</a>
      ${j.phone ? `<a class="btn" href="tel:${esc(j.phone)}">📞 Call</a>
      <a class="btn blue" id="omw" href="${esc(smsLink(j.phone, omw))}">💬 On my way</a>` : '<span></span><span></span>'}
    </div>
    <div class="lbl" style="margin-top:14px;font-size:12px;color:var(--muted)">STATUS</div>
    <div class="statusrow">${STATUSES.map(s => `<button data-s="${s}" class="${j.status === s ? 'on' : ''}">${s}</button>`).join('')}</div>
    <div class="field"><div class="lbl">Install notes</div><div class="notes">${esc(j.notes) || '—'}</div></div>
    <div class="field"><div class="lbl">Crew</div>${esc(list(j.installers).join(', ')) || 'Unassigned'}</div>
    <div class="field"><div class="lbl">Photos (${photos.length})</div>
      <div class="photos">${photos.map(p => `<a href="https://drive.google.com/file/d/${esc(p)}/view" target="_blank"><img loading="lazy" src="https://drive.google.com/thumbnail?id=${esc(p)}&sz=w600"></a>`).join('')}</div>
      <button class="btn" id="addPhoto">📷 Add photos</button></div>
    ${isOwner() ? `<button class="btn pri" id="editBtn">Edit job</button><button class="btn danger" id="delBtn">Delete job</button>` : ''}
    <button class="btn" id="closeBtn">Close</button>`);
  $('closeBtn').onclick = closeSheet;
  document.querySelectorAll('.statusrow button').forEach(b => b.onclick = () => setStatus(j.id, b.dataset.s));
  if ($('omw')) $('omw').addEventListener('click', () => { if (j.status === 'Scheduled') setTimeout(() => setStatus(j.id, 'En route', true), 300); });
  $('addPhoto').onclick = () => $('photoInput').click();
  if (isOwner()) {
    $('editBtn').onclick = () => editJob(j);
    $('delBtn').onclick = async () => {
      if (!confirm(`Delete ${j.client}? This also removes the calendar event.`)) return;
      await api('delete', { id: j.id }); closeSheet(); render(); toast('Deleted');
    };
  }
}

async function setStatus(id, status, quiet) {
  try { await api('status', { id, status }); render(); if (S.openId === id) openJob(id); if (!quiet) toast(status); }
  catch (e) { toast(e.message); }
}

/* ---------- photos ---------- */
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
$('photoInput').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const id = S.openId; if (!id || !files.length) return;
  try {
    for (let i = 0; i < files.length; i++) {
      toast(`Uploading ${i + 1} of ${files.length}…`);
      await api('photo', { id, data: await shrink(files[i]) });
    }
    render(); openJob(id); toast('Photos added');
  } catch (err) { toast('Upload failed: ' + err.message); }
};

/* ---------- add / edit (owner) ---------- */
$('fab').onclick = () => editJob(null);

function editJob(j, presetDate) {
  const d = j || { date: presetDate || '', start: '', end: '', client: '', phone: '', address: '', type: 'Landscape', status: 'Scheduled', installers: '', notes: '' };
  let type = d.type || 'Landscape';
  const picked = new Set(list(d.installers));
  openSheet(`
    <h2>${j ? 'Edit job' : 'New job'}</h2>
    <label class="inp">Job type</label>
    <div class="typepick"><button data-t="Landscape">💡 Landscape</button><button data-t="Holiday">🎄 Permanent Holiday</button></div>
    <label class="inp">Client name<input id="f_client" value="${esc(d.client)}" autocomplete="off"></label>
    <label class="inp">Client mobile<input id="f_phone" type="tel" value="${esc(d.phone)}"></label>
    <label class="inp">Address<input id="f_address" value="${esc(d.address)}" autocomplete="off"></label>
    <div class="three">
      <label class="inp">Date<input id="f_date" type="date" value="${esc(d.date)}"></label>
      <label class="inp">Start<input id="f_start" type="time" value="${esc(d.start)}"></label>
      <label class="inp">End<input id="f_end" type="time" value="${esc(d.end)}"></label>
    </div>
    <label class="inp">Assign installers</label>
    <div class="crewpick">${S.crew.map(c => `<button data-n="${esc(c.name)}" class="${picked.has(c.name) ? 'on' : ''}">${esc(c.name)}</button>`).join('')}</div>
    <label class="inp">Install notes (fixtures, zones, gate code, dog, etc.)<textarea id="f_notes">${esc(d.notes)}</textarea></label>
    <button class="btn pri" id="saveBtn">${j ? 'Save changes' : 'Add job & notify crew'}</button>
    <button class="btn" id="cancelBtn">Cancel</button>`);
  const paintType = () => document.querySelectorAll('.typepick button').forEach(b => b.className = b.dataset.t === type ? 'on ' + type : '');
  paintType();
  document.querySelectorAll('.typepick button').forEach(b => b.onclick = () => { type = b.dataset.t; paintType(); });
  document.querySelectorAll('.crewpick button').forEach(b => b.onclick = () => {
    const n = b.dataset.n; picked.has(n) ? picked.delete(n) : picked.add(n); b.classList.toggle('on');
  });
  $('cancelBtn').onclick = () => j ? openJob(j.id) : closeSheet();
  $('saveBtn').onclick = async () => {
    const job = {
      id: j ? j.id : '', type, client: $('f_client').value, phone: $('f_phone').value, address: $('f_address').value,
      date: $('f_date').value, start: $('f_start').value, end: $('f_end').value, notes: $('f_notes').value,
      installers: [...picked].join(', ')
    };
    if (!job.client.trim()) { toast('Add a client name'); return; }
    try {
      await api('save', { job });
      render();
      const saved = j ? S.jobs.find(x => x.id === j.id) : null;
      if (saved) openJob(saved.id); else closeSheet();
      toast(j ? 'Saved' : (picked.size ? 'Job added · crew notified' : 'Job added'));
    } catch (e) { toast(e.message); }
  };
}

/* ---------- start ---------- */
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.user) { try { await api('list'); render(); } catch (e) {} }
});
(function start() {
  let saved = '';
  try { saved = localStorage.getItem('illumicoPin') || ''; } catch (e) {}
  if (saved) login(saved); else $('login').style.display = 'block';
})();
</script>
</body>
</html>
